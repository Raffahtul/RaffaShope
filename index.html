<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RapShop | Toko Sepatu Online</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #ef4444;
      --primary-hover: #dc2626;
      --primary-light: rgba(239,68,68,.12);

      --bg-dark: #090d14;
      --card-dark: #121927;
      --border-dark: #263247;
      --text-dark: #f8fafc;
      --muted-dark: #94a3b8;

      --bg-light: #f5f7fb;
      --card-light: #ffffff;
      --border-light: #dfe5ee;
      --text-light: #101828;
      --muted-light: #667085;

      --bg: var(--bg-dark);
      --card: var(--card-dark);
      --border: var(--border-dark);
      --text: var(--text-dark);
      --muted: var(--muted-dark);

      --radius: 16px;
      --shadow: 0 12px 35px rgba(0,0,0,.35);
      --transition: .28s ease;
    }

    [data-theme="light"] {
      --bg: var(--bg-light);
      --card: var(--card-light);
      --border: var(--border-light);
      --text: var(--text-light);
      --muted: var(--muted-light);
      --shadow: 0 12px 30px rgba(15,23,42,.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Poppins", sans-serif;
      scroll-behavior: smooth;
    }

    html {
      scroll-padding-top: 90px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      transition: background var(--transition), color var(--transition);
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .container {
      width: min(1280px, calc(100% - 32px));
      margin: auto;
    }

    /* NAVBAR */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid var(--border);
      background: rgba(9,13,20,.88);
      backdrop-filter: blur(14px);
    }

    [data-theme="light"] .navbar {
      background: rgba(255,255,255,.9);
    }

    .nav-container {
      min-height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-size: 27px;
      font-weight: 900;
      letter-spacing: -.8px;
      white-space: nowrap;
    }

    .logo span {
      color: var(--primary);
    }

    .nav-menu {
      display: flex;
      gap: 28px;
      align-items: center;
      list-style: none;
    }

    .nav-link {
      font-size: 14px;
      color: var(--muted);
      font-weight: 600;
      transition: var(--transition);
    }

    .nav-link:hover {
      color: var(--primary);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      display: grid;
      place-items: center;
      position: relative;
      transition: var(--transition);
    }

    .icon-btn:hover {
      color: var(--primary);
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    .cart-count {
      position: absolute;
      top: -4px;
      right: -3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      display: grid;
      place-items: center;
    }

    .hamburger {
      display: none;
      font-size: 19px;
      color: var(--text);
    }

    /* HERO */
    .hero {
      padding: 75px 0 60px;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      background: rgba(239,68,68,.13);
      filter: blur(80px);
      top: -180px;
      right: -120px;
      pointer-events: none;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      gap: 55px;
      align-items: center;
    }

    .hero-tag {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid rgba(239,68,68,.35);
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .hero-title {
      font-size: clamp(38px, 5vw, 64px);
      line-height: 1.08;
      font-weight: 900;
      letter-spacing: -1.8px;
      margin-bottom: 20px;
    }

    .hero-title span {
      color: var(--primary);
    }

    .hero-desc {
      color: var(--muted);
      line-height: 1.8;
      max-width: 650px;
      margin-bottom: 28px;
      font-size: 15px;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn {
      padding: 13px 20px;
      border-radius: 11px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 700;
      transition: var(--transition);
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 8px 25px rgba(239,68,68,.25);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
    }

    .btn-outline {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-outline:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .hero-visual {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      min-height: 420px;
    }

    .hero-circle {
      width: 390px;
      height: 390px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(239,68,68,.92), rgba(249,115,22,.8));
      filter: blur(2px);
      opacity: .17;
      position: absolute;
    }

    .hero-shoe {
      width: min(100%, 520px);
      border-radius: 28px;
      transform: rotate(-8deg);
      filter: drop-shadow(0 30px 35px rgba(0,0,0,.4));
      animation: floating 4s ease-in-out infinite;
      position: relative;
      z-index: 2;
    }

    @keyframes floating {
      0%,100% { transform: rotate(-8deg) translateY(0); }
      50% { transform: rotate(-8deg) translateY(-14px); }
    }

    /* SECTION */
    section {
      padding: 35px 0;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: end;
      margin-bottom: 22px;
    }

    .section-title {
      font-size: 28px;
      font-weight: 900;
    }

    .section-subtitle {
      color: var(--muted);
      margin-top: 5px;
      font-size: 13px;
    }

    /* CATEGORIES */
    .category-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }

    .category-card {
      padding: 18px 10px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--card);
      text-align: center;
      transition: var(--transition);
      cursor: pointer;
    }

    .category-card i {
      color: var(--primary);
      font-size: 22px;
      margin-bottom: 8px;
    }

    .category-card h4 {
      font-size: 13px;
    }

    .category-card:hover,
    .category-card.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      transform: translateY(-3px);
    }

    .category-card:hover i,
    .category-card.active i {
      color: #fff;
    }

    /* BRANDS */
    .brand-list {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 8px;
    }

    .brand-btn {
      white-space: nowrap;
      padding: 9px 17px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      transition: var(--transition);
    }

    .brand-btn:hover,
    .brand-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* TOOLBAR */
    .toolbar {
      padding: 15px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 10px;
      margin-bottom: 25px;
    }

    .search-wrap {
      position: relative;
    }

    .search-wrap i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
    }

    .search-input,
    .filter-select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      outline: none;
    }

    .search-input {
      padding-left: 41px;
    }

    .search-input:focus,
    .filter-select:focus {
      border-color: var(--primary);
    }

    /* PRODUCTS */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .product-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 17px;
      padding: 12px;
      overflow: hidden;
      transition: var(--transition);
      position: relative;
    }

    .product-card:hover {
      transform: translateY(-5px);
      border-color: var(--primary);
      box-shadow: var(--shadow);
    }

    .product-image-box {
      height: 205px;
      border-radius: 13px;
      overflow: hidden;
      background: var(--bg);
      position: relative;
    }

    .product-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: .35s ease;
    }

    .product-card:hover .product-image {
      transform: scale(1.07);
    }

    .product-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 2;
      padding: 5px 9px;
      border-radius: 999px;
      background: var(--primary);
      color: #fff;
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .product-info {
      padding: 13px 3px 3px;
    }

    .product-brand {
      color: var(--primary);
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 900;
      letter-spacing: .5px;
      margin-bottom: 5px;
    }

    .product-name {
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 6px;
      line-height: 1.35;
    }

    .product-rating {
      color: #f59e0b;
      font-size: 11px;
      margin-bottom: 8px;
    }

    .product-rating span {
      color: var(--muted);
      margin-left: 5px;
    }

    .product-price {
      font-size: 17px;
      font-weight: 900;
      margin-bottom: 11px;
    }

    .product-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .small-btn {
      padding: 9px 6px;
      border-radius: 9px;
      font-size: 11px;
      font-weight: 800;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
    }

    .detail-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .cart-btn {
      background: var(--primary);
      color: #fff;
    }

    .wa-btn {
      grid-column: 1 / -1;
      background: #25d366;
      color: #fff;
    }

    .wa-btn:hover {
      background: #1fae53;
    }

    .empty-state {
      grid-column: 1/-1;
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    .empty-state i {
      color: var(--primary);
      font-size: 48px;
      margin-bottom: 12px;
    }

    /* ABOUT */
    .about-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 30px;
    }

    .about-grid {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 30px;
      align-items: center;
    }

    .about-text p {
      color: var(--muted);
      line-height: 1.8;
      font-size: 14px;
      margin-top: 10px;
    }

    .features {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .feature {
      padding: 18px;
      border-radius: 14px;
      background: var(--bg);
      border: 1px solid var(--border);
    }

    .feature i {
      color: var(--primary);
      font-size: 21px;
      margin-bottom: 8px;
    }

    .feature h4 {
      font-size: 13px;
      margin-bottom: 4px;
    }

    .feature p {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.5;
    }

    /* CONTACT */
    .contact-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .contact-card {
      text-align: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 25px 18px;
    }

    .contact-card i {
      font-size: 30px;
      color: var(--primary);
      margin-bottom: 10px;
    }

    .contact-card h4 {
      font-size: 15px;
      margin-bottom: 5px;
    }

    .contact-card p {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 14px;
    }

    /* MODAL */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.72);
      backdrop-filter: blur(7px);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .overlay.active {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 760px;
      max-height: 90vh;
      overflow: auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 22px;
      position: relative;
    }

    .close {
      position: absolute;
      top: 13px;
      right: 13px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
      margin-top: 20px;
    }

    .detail-image {
      width: 100%;
      height: 310px;
      border-radius: 15px;
      object-fit: cover;
      background: var(--bg);
    }

    .detail-brand {
      color: var(--primary);
      font-weight: 900;
      font-size: 12px;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .detail-title {
      font-size: 24px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .detail-desc {
      color: var(--muted);
      line-height: 1.7;
      font-size: 13px;
      margin: 12px 0;
    }

    .sizes {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 14px 0 20px;
    }

    .size {
      width: 42px;
      height: 38px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
    }

    .size.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    /* CART */
    .cart-list {
      margin-top: 15px;
    }

    .cart-item {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .cart-image {
      width: 65px;
      height: 65px;
      border-radius: 10px;
      object-fit: cover;
    }

    .cart-info {
      flex: 1;
    }

    .cart-name {
      font-size: 13px;
      font-weight: 800;
    }

    .cart-meta {
      font-size: 11px;
      color: var(--muted);
      margin-top: 3px;
    }

    .qty {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 6px;
    }

    .qty button {
      width: 25px;
      height: 25px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
    }

    .cart-price {
      font-size: 13px;
      font-weight: 900;
    }

    .cart-summary {
      padding-top: 16px;
      margin-top: 10px;
      border-top: 1px solid var(--border);
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 13px;
      color: var(--muted);
    }

    .summary-total {
      display: flex;
      justify-content: space-between;
      color: var(--text);
      font-size: 18px;
      font-weight: 900;
      margin: 12px 0 16px;
    }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 3000;
      background: var(--primary);
      color: white;
      padding: 13px 17px;
      border-radius: 11px;
      font-size: 12px;
      font-weight: 700;
      transform: translateY(90px);
      opacity: 0;
      transition: .3s ease;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    /* FOOTER */
    footer {
      border-top: 1px solid var(--border);
      margin-top: 30px;
      padding: 45px 0 25px;
      background: var(--card);
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 30px;
      margin-bottom: 30px;
    }

    .footer-desc {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
      margin-top: 10px;
    }

    .footer-title {
      font-weight: 800;
      margin-bottom: 11px;
      font-size: 14px;
    }

    .footer-links {
      list-style: none;
    }

    .footer-links li {
      margin-bottom: 8px;
    }

    .footer-links a {
      color: var(--muted);
      font-size: 12px;
    }

    .footer-links a:hover {
      color: var(--primary);
    }

    .copyright {
      padding-top: 20px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
      text-align: center;
    }

    /* RESPONSIVE */
    @media (max-width: 1050px) {
      .product-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .category-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .footer-grid {
        grid-template-columns: 1.5fr 1fr 1fr;
      }
    }

    @media (max-width: 800px) {
      .nav-menu {
        position: fixed;
        top: 74px;
        left: 16px;
        right: 16px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 15px;
        flex-direction: column;
        align-items: stretch;
        gap: 5px;
        display: none;
      }

      .nav-menu.show {
        display: flex;
      }

      .nav-link {
        display: block;
        padding: 11px;
        border-radius: 8px;
      }

      .nav-link:hover {
        background: var(--primary-light);
      }

      .hamburger {
        display: grid;
      }

      .hero-grid,
      .about-grid,
      .detail-grid {
        grid-template-columns: 1fr;
      }

      .hero {
        padding-top: 45px;
      }

      .hero-visual {
        min-height: 300px;
      }

      .hero-circle {
        width: 280px;
        height: 280px;
      }

      .toolbar {
        grid-template-columns: 1fr;
      }

      .product-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .contact-grid {
        grid-template-columns: 1fr;
      }

      .footer-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 520px) {
      .container {
        width: min(100% - 22px, 1280px);
      }

      .nav-actions {
